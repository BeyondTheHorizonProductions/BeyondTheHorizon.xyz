<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Beyond the Horizon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="32x32">

  <meta property="og:title" content="Beyond the Horizon">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://beyondthehorizon.xyz/">
  <meta property="og:image" content="https://beyondthehorizon.xyz/image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1750">
  <meta property="og:image:height" content="992">
  <meta name="theme-color" content="#e89150">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="stage">
    <div class="content">
      <h1 class="wordmark">Beyond The Horizon</h1>

      <nav class="portals" aria-label="Community links">
        <a class="portal" href="https://discord.beyondthehorizon.xyz">Discord</a>
        <a class="portal" href="https://appeals.beyondthehorizon.xyz">Appeals</a>
        <a class="portal" href="https://rules.beyondthehorizon.xyz">Rules</a>
      </nav>
    </div>

    <p class="disclaimer">We are not affiliated with Mojang Studios or Microsoft.</p>
  </main>

  <!-- Shown only once a link is taken. The links navigate normally
       without JS, so this is purely additive. -->
  <div class="leaving" id="leaving" hidden>
    <div class="leaving-inner" role="status" aria-live="polite">
      <p class="leaving-msg">Redirecting to <span id="leaving-target">Discord</span></p>
      <div class="loadbar" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>
  </div>

  <script src="main.js" defer></script>
</body>

</html>
